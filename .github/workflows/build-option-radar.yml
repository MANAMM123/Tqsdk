name: Release OptionRadar Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: option_radar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name OptionRadar --collect-submodules scipy._external.array_api_compat app.py

      - name: Package zip
        run: Compress-Archive -Path dist/OptionRadar -DestinationPath OptionRadar-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptionRadar-Windows
          path: option_radar/OptionRadar-Windows.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: option_radar/OptionRadar-Windows.zip
          generate_release_notes: true
